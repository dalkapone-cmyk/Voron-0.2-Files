

#####################################################################
# Macros
#####################################################################

[gcode_macro PRINT_START]
gcode:        
    # Parameters
    G28                                                                          ; home all axes
    G90                                                                          ; absolute positioning
    
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}

     SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                         ; enable filament sensor
 
    M190 S{bedtemp}                                                              ; set & wait for bed temp
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp} ; wait for chamber temp
   
    M109 S{hotendtemp}                                                           ; set & wait for hotend temp
    
   
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-3.0 F3600                 ; retract filament
    G91                            ; relative positioning
   
    #  Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #  Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0       ; disable filament sensor

    G0 Z{z_safe} F3600                                        ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000                             ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                                                      ; turn off fan
    G90                                                       ; absolute positioning
    G0 X60 Y{max_y} F3600                                     ; park nozzle at rear
    G0 z90 F3600                                              ; Lower the bed to 75% position
    #G28 X Y                                                  ;Home X and Y


####################################################################

[gcode_macro CHOME]
description: Homes XYZ axis only if printer is in a non-homed state
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro CENTER]
description: Moves the toolhead to the center
gcode:
  CHOME
  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  G90
  G1 X{x_center} Y{x_center} F7800

[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
  CHOME
  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  G90
  G1 X{x_center} Y10 F7800

######################################################################

[gcode_macro NOZZLE_PURGE]
description: Draw a purge line at the front left edge of the build plate
gcode:
  CHOME
  G0 X2.5 Y4 F3000                           ; Go to front
  G0 Z0.15                                   ; Drop to bed
  M83                                        ; Set extruder to relative mode
  G1 X45 E15 F500                            ; Extrude 25mm of filament in a 4cm line
  G1 E-0.5 F400                              ; Retract a little
  G1 X85 F4000                               ; Quickly wipe away from the filament line
  G1 Z0.3                                    ; Raise and begin printing.

#####################################################################

[filament_switch_sensor filament_sensor]
switch_pin: ^gpio16
pause_on_runout: True
runout_gcode:
 #PARK_MACRO
    M117 Out of Filament
    #LCDRGB R=1 G=0 B=0  # Turn LCD red
insert_gcode:
   #RESUME_MACRO
     M117 Resuming
event_delay: 3.0
pause_delay: 0.5
   
# [filament_motion_sensor smart_sensor]
# switch_pin: ^gpio16
# detection_length: 2.5

######################################################################

[gcode_macro PARK]
description: Park the toolhead at the back and retract some filament if the nozzle is hot
gcode:
     {% set th = printer.toolhead %}
    G91                                     ; Relative positioning
    G1 Z5 F1200                             ; Lift nozzle by 5mm (adjust as needed)
    G90                                     ; Absolute positioning
    G0 X60 Y110 F3600                       ; Move to park position (adjust X and Y coordinates for your printer)
    G91                                     ; Back to relative positioning
    G1 Z-10 F1200                           ; Optional: lower back down if you prefer
    G90                                     ; Back to absolute positioning

    # retract filament before move up toolhead
    {% if printer.extruder.temperature > 185 %}
    
    {% endif %}
    G1 E-0.8 F3600                         ; Retract filament slightly to prevent oozing
    G90
   

######################################################################

[gcode_macro M109]
rename_existing: M99109
gcode:
   
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}                          ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}                           ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:

    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}                          ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}                         ; Wait for bed temp (within 1 degree)
    {% endif %}

#######################################################################

[gcode_macro SHUTDOWN]
gcode:
    #LCDRGB R=0 G=0 B=0                                                                      ; Turn off LCD neopixels (see above for this macro)
    #OFF                                                                                     ; Shortcut to turn everything off (see above for this macro)
    {action_respond_info('action:poweroff')}                                                 ; OctoPrint compatible host shutdown
	{action_call_remote_method("shutdown_machine")}                                          ; Moonraker compatible host shutdown

#######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:

    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

       SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                   ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                                  ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                                  ; enable filament sensor
        #INITIAL_RGB                                                                         ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}          ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                                ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                             ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                                  ; relative positioning
        M83                                                                                  ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                        ; prime nozzle by E, lower Z back down
        {% else %} 
            G1 Z{zhop * -1} F900                                                             ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                                  ; restore position
        BASE_RESUME                                                                          ; resume print
    {% endif %}


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}              ; set timeout back to configured value
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                      ; disable filament sensor
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT    
      
####################################################################

[gcode_macro LIGHT_ON]
variable_delay_ms: 50
variable_led_count: 8
gcode:
  {% for led_index in range(1, led_count + 1) %}
    SET_LED LED=rgb1 RED=0.8 GREEN=0.8 BLUE=0.99 INDEX={led_index}
    SET_LED LED=rgb2 RED=0.8 GREEN=0.8 BLUE=0.99 INDEX={led_index}
    G4 P{delay_ms}
  {% endfor %}
  
[gcode_macro LIGHT_OFF]
gcode:
  SET_LED LED=rgb1 RED=0 GREEN=0 BLUE=0
  SET_LED LED=rgb2 RED=0 GREEN=0 BLUE=0

[gcode_macro LOGO_PENDING]
gcode:
  SET_LED LED=bed_light RED=0.99 GREEN=0.1 BLUE=0.1 WHITE=0

[gcode_macro LOGO_READY]
gcode:
  SET_LED LED=bed_light RED=0.1 GREEN=0.2 BLUE=0.99 WHITE=0

[gcode_macro LOGO_OFF]
gcode:
  SET_LED LED=bed_light RED=0 GREEN=0 BLUE=0 WHITE=0













