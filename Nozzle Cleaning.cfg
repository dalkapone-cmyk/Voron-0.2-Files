

# [servo NOZZLE_WIPER]
pin: gpio20
maximum_servo_angle: 95
#   The maximum angle (in degrees) that this servo can be set to. The
#   default is 180 degrees.
minimum_pulse_width: 0.001
#   The minimum pulse width time (in seconds). This should correspond
#   with an angle of 0 degrees. The default is 0.001 seconds.
maximum_pulse_width: 0.002
#   The maximum pulse width time (in seconds). This should correspond
#   with an angle of maximum_servo_angle. The default is 0.002
#   seconds.
initial_angle: 0
#   Initial angle (in degrees) to set the servo to. The default is to
#   not send any signal at startup.


[gcode_macro WIPE_NOZZLE]
description: "Wipe nozzle N times by DIST mm"
variable_WIPE_TIMES: 5
variable_WIPE_DISTANCE: 25

gcode:
    SET_SERVO SERVO=NOZZLE_WIPER ANGLE=0 ; Make sure silicone brush is out of the way
    {% if "xyz" in printer.toolhead.homed_axes %} ; Check if printer is homed or not
        M118 Printer is already homed
    {% else %}
        M118 Printer needs homing...
        G28 ; Home printer
    {% endif %}
    
    G1 X0 Y118 Z40 F5000.0  ; Move to start position
    
    SET_SERVO SERVO=NOZZLE_WIPER ANGLE=100 ; Present silicone brush
    
    {% set distance = params.WIPE_DISTANCE|default(15)|float %} ; Wipe distance, default is 25mm
    {% set repeats = params.WIPE_TIMES|default(5)|int %} ; Times the nozzle will be cleaned, default 5 times
    {% set start_x = 1 %}  ; Ensure we start from a known position
    {% set start_y = 119 %}  ; Ensure we start from a known position

    {% for i in range(repeats) %}
        G1 Y{start_y} F5000
        G1 X{start_x + distance} F5000
        G1 Y{start_y - 3} F5000
        G1 X{start_x} F7000
    {% endfor %}

    G1 X90 Y100 F5000.0  ; Move away from silicone brush
    
    SET_SERVO SERVO=NOZZLE_WIPER ANGLE=0 ; Retract silicone brush

[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle on the brush
gcode:
    {% set purge_and_brush_enabled = printer["gcode_macro _USER_VARIABLES_OTHER"].purge_and_brush_enabled %}
    
    {% if purge_and_brush_enabled %}
        {% set St = printer["gcode_macro _USER_VARIABLES_OTHER"].travel_speed * 60 %}
        {% set Sz = printer["gcode_macro _USER_VARIABLES_OTHER"].z_drop_speed * 60 %}
        {% set Sc = printer["gcode_macro _USER_VARIABLES_OTHER"].brush_clean_speed * 60 %}

        {% set Px, Py, Pz = printer["gcode_macro _USER_VARIABLES_OTHER"].purge_bucket_xyz|map('float') %}
        {% set Bx, By, Bz = printer["gcode_macro _USER_VARIABLES_OTHER"].brush_xyz|map('float') %}


        # Move to purge zone (left side)
        G90
        G1 X{Px} Y{Py} Z{Bz} F{St}
        # Move to center of the brush
        G1 X{Bx} Y{By} Z{Bz} F{St}

        # Wipe procedure
        G91
        {% for wipe in range(6) %}
            G1 Y-5 F{Sc}
            G1 Y+5 F{Sc}
        {% endfor %}

        G1 X+20 F{Sc}
        {% for wipe in range(6) %}
            G1 X-40 F{Sc}
            G1 X+40 F{Sc}
        {% endfor %}

        G1 Z{Bz|int + 10} F{Sz}

        G90
    {% endif %}


[gcode_macro PURGE]
description: Purge a specific amount of filament ontop of the purge bucket
gcode:
    {% set purge_and_brush_enabled = printer["gcode_macro _USER_VARIABLES_OTHER"].purge_and_brush_enabled %}
    
    {% set DISTANCE = params.DISTANCE|default(10)|float %}
    {% set TEMP = params.TEMP|default(printer["gcode_macro _USER_VARIABLES_OTHER"].print_default_extruder_temp)|float %}
    {% set Z_DROP = params.Z_DROP|default(1)|int %}

    {% set St = printer["gcode_macro _USER_VARIABLES_OTHER"].travel_speed * 60 %}
    {% set Sz = printer["gcode_macro _USER_VARIABLES_OTHER"].z_drop_speed * 60 %}

    G90

    MOVE_TO_PURGE_BUCKET Z_DROP={Z_DROP}

    # Heat if needed and purge
    _LOW_TEMP_CHECK T={TEMP}
  
    G92 E0
    G1 E{DISTANCE|float} F150
  
    # Retract
    G92 E0
    G1 E-1.7 F2100
    G1 E-18.3 F150

    # Wait 20s to let the nozzle ooze before cleaning
    G91
    G1 Z5 F{Sz}
    G90
    G4 P{20 * 1000}
  
    G92 E0


[gcode_macro MOVE_TO_PURGE_BUCKET]
description: Move over the purge bucket
gcode:
    {% set purge_and_brush_enabled = printer["gcode_macro _USER_VARIABLES_OTHER"].purge_and_brush_enabled %}
    {% set Z_DROP = params.Z_DROP|default(1)|int %}
    
    # Move to purge zone only if it's available, else just purge where the toolhead is
    {% if purge_and_brush_enabled %}
        SAVE_GCODE_STATE NAME=MOVE_TO_PURGE_BUCKET
        G90
        {% set St = printer["gcode_macro _USER_VARIABLES_OTHER"].travel_speed * 60 %}

        {% set Px, Py, Pz = printer["gcode_macro _USER_VARIABLES_OTHER"].purge_bucket_xyz|map('float') %}
        {% if Z_DROP == 1 %}
            G1 X{Px} Y{Py} Z{Pz} F{St}
        {% else %}
            G1 X{Px} Y{Py} F{St}
        {% endif %}
        RESTORE_GCODE_STATE NAME=MOVE_TO_PURGE_BUCKET
    {% endif %}

       
 
